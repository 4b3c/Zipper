# Tailnet-only. Nothing here is authenticated, so it must never listen on a
# public address -- bind the tailscale IP explicitly rather than 0.0.0.0.
#   listen $(tailscale ip -4):8800;

# WebSocket upgrade, needed by every ttyd behind /t/.
map $http_upgrade $zipper_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 100.117.22.95:8800;          # replace with `tailscale ip -4`
    # Also on loopback, so `tailscale serve` can put the whole thing behind
    # HTTPS on the tailnet name. That is not cosmetic: browsers only expose
    # navigator.clipboard in a secure context, so copying out of a terminal
    # works on the https name and cannot work on http://<ip>:8800.
    listen 127.0.0.1:8899;
    server_name _;

    # Every conversation's terminal, served from the dashboard's own origin.
    #
    # Each ttyd listens on its own loopback port, and the browser used to be
    # pointed straight at it -- a different origin per conversation, so basic
    # auth prompted again for every one of them. Proxied under /t/<port>/ they
    # are all one origin: signed in to the dashboard is signed in to the
    # terminals. ttyd is started with a matching --base-path, so its own asset
    # and websocket URLs already carry this prefix.
    #
    # The port range is fixed on purpose. `proxy_pass` to a variable port is a
    # proxy to wherever the URL says, so it is pinned to 88xx -- the dashboard's
    # own ttyd and the conversation range -- and cannot be walked onto anything
    # else listening on loopback.
    location ~ ^/t/(88[0-9][0-9])(/.*)?$ {
        proxy_pass http://127.0.0.1:$1$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zipper_connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1d;          # a terminal sits idle for hours
    }

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        # the dashboard streams its refresh over SSE; buffering stalls it
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
