# Tailnet-only. Nothing here is authenticated, so it must never listen on a
# public address -- bind the tailscale IP explicitly rather than 0.0.0.0.
#   listen $(tailscale ip -4):8800;
server {
    listen 100.64.0.1:8800;          # replace with `tailscale ip -4`
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        # the dashboard streams its refresh over SSE; buffering stalls it
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
